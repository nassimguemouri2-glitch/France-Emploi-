<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>France Emploi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }header {
  background: #0055a4;
  color: white;
  padding: 25px;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
}

.search-box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ccc;
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  background: #0055a4;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#resultats {
  margin-top: 25px;
}

  </style>
</head><body><header>
  <h1>France Emploi</h1>
  <p>Recherche d'emploi</p>
</header><div class="container">
  <div class="search-box">
    <h2>Recherche d'emploi</h2><input id="metier" type="text" placeholder="Métier, exemple : chauffeur">

<input id="ville" type="text" placeholder="Ville, exemple : Paris">

<button onclick="rechercher()">Rechercher</button>

<div id="resultats"></div>

  </div>
</div><script>
  function rechercher() {
    const metier = document.getElementById("metier").value;
    const ville = document.getElementById("ville").value;
    const resultats = document.getElementById("resultats");

    if (!metier && !ville) {
      resultats.innerHTML = "<p>Veuillez entrer un métier ou une ville.</p>";
      return;
    }

    resultats.innerHTML =
      "<h3>Recherche effectuée</h3>" +
      "<p>Métier : " + (metier || "Tous") + "</p>" +
      "<p>Ville : " + (ville || "Toutes") + "</p>";
  }
</script></body>
</html>
